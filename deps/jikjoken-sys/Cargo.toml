[package]
name = "jikjoken-sys"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "jikjoken"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core tiktoken dependencies (vendored)
fancy-regex = "0.13.0"
regex = "1.10.3"
rustc-hash = "2"
bstr = "1.5.0"

[build-dependencies]
cbindgen = "0.27"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
