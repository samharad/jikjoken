# cbindgen configuration for generating C headers

language = "C"
autogen_warning = "/* Warning: This file is autogenerated by cbindgen. Don't modify manually. */"
include_version = true

[export]
prefix = "JikJoken"
include = ["JikJokenError", "JikJokenTokens", "JikJokenEncoding"]

[export.rename]
"JikJokenEncoding" = "JikJokenEncoding"
"JikJokenTokens" = "JikJokenTokens"
"JikJokenError" = "JikJokenError"

[parse]
parse_deps = false
include = ["jikjoken-sys"]

[fn]
prefix = "jikjoken_"
args = "vertical"
